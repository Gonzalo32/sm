<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICT Assistant — TradeSea</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      color: #38bdf8;
    }
    .status-badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .label {
      color: #94a3b8;
    }
    .value {
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
  <script type="module" crossorigin src="/popup/popup.js"></script>
</head>
<body>
  <div class="header">
    <div class="title">ICT Assistant</div>
    <div class="status-badge">Phase 0 — Investigation</div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Platform:</span>
      <span class="value" id="platform-val">TradeSea Web</span>
    </div>
    <div class="row">
      <span class="label">Symbol:</span>
      <span class="value" id="symbol-val">--</span>
    </div>
    <div class="row">
      <span class="label">Timeframe:</span>
      <span class="value" id="tf-val">--</span>
    </div>
    <div class="row">
      <span class="label">Framework:</span>
      <span class="value" id="fw-val">TradingView</span>
    </div>
    <div class="row">
      <span class="label">Data Probe:</span>
      <span class="value" style="color:#4ade80;" id="probe-val">Ready</span>
    </div>
  </div>

  <button id="btn-scan">Trigger Probe Scan</button>

</body>
</html>
